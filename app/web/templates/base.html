<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "ResourcesGetBot Admin" }}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }
    body { margin: 0; }
    header {
      background: #102a43;
      color: white;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header a { color: #d9e2ec; text-decoration: none; margin-left: 18px; }
    main { max-width: 1180px; margin: 28px auto; padding: 0 18px; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { font-size: 24px; margin: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid #d9e2ec;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e6edf3;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th { background: #f0f4f8; color: #334e68; }
    code {
      display: inline-block;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
      white-space: nowrap;
    }
    .button {
      display: inline-block;
      border: 0;
      background: #0b69a3;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }
    .button.secondary { background: #52606d; }
    .button.danger { background: #ba2525; }
    form.inline { display: inline; }
    .form {
      background: white;
      border: 1px solid #d9e2ec;
      padding: 18px;
      max-width: 760px;
    }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      border: 1px solid #bcccdc;
      border-radius: 6px;
      font: inherit;
    }
    textarea { min-height: 110px; }
    .error {
      background: #ffe3e3;
      border: 1px solid #ffbdbd;
      color: #8a041a;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .muted { color: #627d98; }
    @media (max-width: 760px) {
      header { display: block; }
      header nav { margin-top: 10px; }
      table { display: block; overflow-x: auto; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <strong>ResourcesGetBot Admin</strong>
    <nav>
      <a href="/admin">资源</a>
      <a href="/admin/users">用户</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
